# 12.40
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: false
tcp-concurrent: true
external-controller: "127.0.0.1:9090"
profile:
  store-fake-ip: true
  store-selected: true
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "*.lan"
  - "*.localdomain"
  - "*.example"
  - "*.invalid"
  - "*.localhost"
  - "*.test"
  - "*.local"
  - "*.home.arpa"
  - "connectivitycheck.gstatic.com"
  - "connectivitycheck.android.com"
  - "msftconnecttest.com"
  - "msftncsi.com"
  default-nameserver:
  - 77.88.8.8
  - 77.88.8.1
  direct-nameserver:
  - "tls://77.88.8.8#DIRECT"
  - "tls://77.88.8.1#DIRECT"
  - "https://77.88.8.8/dns-query#DIRECT"
  nameserver:
  - "tls://77.88.8.8#skip-cert-verify=true"
  - "tls://77.88.8.1#skip-cert-verify=true"
  - "https://1.1.1.1/dns-query#Режим"
  - "https://8.8.8.8/dns-query#Режим"
  nameserver-policy:
    raw.githubusercontent.com,cdn.jsdelivr.net,github.com:
    - "tls://77.88.8.8#DIRECT"
    - "tls://77.88.8.1#DIRECT"
    - "https://77.88.8.8/dns-query#DIRECT"
    "rule-set:category-ru,whitelist,private-domains":
    - "tls://77.88.8.8#DIRECT"
    - "tls://77.88.8.1#DIRECT"
    - "https://77.88.8.8/dns-query#DIRECT"
    +.gitverse.ru,+.gidroksi.fun,+.cyb-portal.org,+.githubusercontent.com,+.github.com,+.jsdelivr.net:
    - "tls://77.88.8.8#DIRECT"
    - "tls://77.88.8.1#DIRECT"
    - "https://77.88.8.8/dns-query#DIRECT"
    "connectivitycheck.gstatic.com,connectivitycheck.android.com,+.msftconnecttest.com,+.msftncsi.com":
    - "tls://77.88.8.8#DIRECT"
    - "tls://77.88.8.1#DIRECT"
    - "https://77.88.8.8/dns-query#DIRECT"
  prefer-h3: false
  proxy-server-nameserver:
  - "tls://77.88.8.8#DIRECT"
  - "tls://77.88.8.1#DIRECT"
  - "https://77.88.8.8/dns-query#DIRECT"
  use-hosts: true
  use-system-hosts: true
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: false
  parse-pure-ip: true
  skip-dst-address:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/3
  - "::/127"
  - "fc00::/7"
  - "fe80::/10"
  - "ff00::/8"
  sniff:
    HTTP:
      override-destination: true
      ports:
      - 80
      - 8080-8880
    TLS:
      override-destination: true
      ports:
      - 443
      - 8443
